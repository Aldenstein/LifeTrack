[package]
# Package: lifetrackdb
# Description (FR): crate backend pour l'API LifeTrack.
# Contient les dépendances nécessaires pour exécuter le serveur HTTP,
# l'accès MySQL via `sqlx`, la sérialisation `serde`, et l'authentification JWT.
name = "lifetrackdb"
version = "3.1.2"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql", "macros", "chrono"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = "9"
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
hmac = "0.12"

[dev-dependencies]
aes-gcm = "0.10"
